services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: momshell
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: "host=postgres port=5432 sslmode=disable"
      PGUSER: ${POSTGRES_USER:-momshell}
      PGPASSWORD: ${POSTGRES_PASSWORD:-momshell}
      PGDATABASE: ${POSTGRES_DB:-momshell}
    ports:
      - "7860:7860"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7860/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: momshell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momshell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momshell}
      POSTGRES_DB: ${POSTGRES_DB:-momshell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  uploads:
